<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spider License Panel</title>
<style>
:root{color-scheme:dark;--bg:#080b14;--panel:#111827;--line:#28344c;--red:#f04452;--blue:#36a3ff;--text:#edf4ff;--muted:#9aa9c2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,#142b4b 0,transparent 35%),radial-gradient(circle at 100% 20%,#401323 0,transparent 30%),var(--bg);font-family:Inter,system-ui,Arial;color:var(--text);min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:28px 16px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--red),var(--blue));display:grid;place-items:center;font-size:25px;font-weight:900;box-shadow:0 0 28px #36a3ff33}.brand h1{font-size:22px;margin:0}.brand p{color:var(--muted);margin:4px 0 0;font-size:13px}.card{background:#101827ed;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 18px 60px #0004}.hidden{display:none!important}.row{display:flex;gap:10px;flex-wrap:wrap}.field{flex:1;min-width:190px}label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}input{width:100%;background:#080e19;border:1px solid #30405c;border-radius:10px;color:var(--text);padding:12px;outline:none}input:focus{border-color:var(--blue)}button{border:0;border-radius:10px;padding:11px 15px;font-weight:750;cursor:pointer;color:white;background:linear-gradient(100deg,#d72c46,#2b8be8)}button.secondary{background:#24334a}button.danger{background:#8f2536}button:disabled{opacity:.5;cursor:wait}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:end}.toolbar .field{flex:1}.notice{font-size:13px;color:var(--muted);margin:10px 0 0;white-space:pre-wrap}.error{color:#ff7c87}.success{color:#7de0ae}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:14px;min-width:620px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #26334a;font-size:13px}th{color:var(--muted);font-weight:650}.pill{display:inline-block;border-radius:99px;padding:4px 8px;font-size:11px;background:#153d31;color:#81e5b3}.empty{text-align:center;color:var(--muted);padding:28px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.topline h2{font-size:17px;margin:0}.tiny{font-size:11px;color:var(--muted)}@media(max-width:600px){.wrap{padding:18px 12px}.card{padding:15px}.brand h1{font-size:19px}}
</style></head><body><main class="wrap"><header class="brand"><div class="logo">✳</div><div><h1>SPIDER LICENSE PANEL</h1><p>OWNER CONTROL · BOT TOKEN LICENSES</p></div></header>
<section id="loginCard" class="card"><h2>Login Owner</h2><form id="loginForm"><div class="field"><label>Password owner</label><input id="password" type="password" autocomplete="current-password" required></div><p><button type="submit">Masuk Panel</button></p></form><div id="loginMsg" class="notice"></div></section>
<section id="app" class="hidden"><div class="card"><div class="topline"><h2>Tambah Lisensi</h2><span class="tiny">Token disimpan sebagai SHA-256 hash</span></div><form id="addForm"><div class="row" style="margin-top:15px"><div class="field"><label>Token Telegram Bot</label><input id="token" type="password" placeholder="123456789:ABC..." autocomplete="off" required></div><div class="field"><label>Label (opsional)</label><input id="label" placeholder="Bot utama / customer A"></div><div style="align-self:end"><button type="submit">+ Add Token</button></div></div></form><div id="addMsg" class="notice"></div></div>
<div class="card"><div class="topline"><h2>Daftar Lisensi</h2><button id="logout" class="secondary">Logout</button></div><div class="toolbar" style="margin-top:15px"><div class="field"><label>Search Token / Label / ID</label><input id="query" placeholder="Cari lisensi..."></div><button id="searchBtn" class="secondary">Search</button><button id="listBtn" class="secondary">List Semua</button></div><div id="listMsg" class="notice"></div><div class="table-wrap"><table><thead><tr><th>Label</th><th>Token Hash</th><th>Status</th><th>Dibuat</th><th>Aksi</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">Belum memuat lisensi.</td></tr></tbody></table></div></div></section>
</main><script>
const $=id=>document.getElementById(id);let loggedIn=false;
function msg(id,text,kind=''){const el=$(id);el.textContent=text;el.className='notice '+kind}
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
function showApp(){loggedIn=true;$('loginCard').classList.add('hidden');$('app').classList.remove('hidden');loadList()}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();msg('loginMsg','Memeriksa login...');try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';showApp()}catch(e){msg('loginMsg',e.message,'error')}});
async function loadList(q=null){msg('listMsg','Memuat lisensi...');try{const url=q===null?'/api/licenses':'/api/licenses/search?q='+encodeURIComponent(q);const d=await api(url);render(d.licenses||[]);msg('listMsg',`${(d.licenses||[]).length} lisensi ditemukan.`,'success')}catch(e){msg('listMsg',e.message,'error');if(/Sesi owner/.test(e.message)){loggedIn=false;$('app').classList.add('hidden');$('loginCard').classList.remove('hidden')}}}
function render(items){const body=$('rows');body.innerHTML='';if(!items.length){body.innerHTML='<tr><td colspan="5" class="empty">Tidak ada lisensi.</td></tr>';return}for(const x of items){const tr=document.createElement('tr');const vals=[x.label||'(tanpa label)',x.tokenMasked||'',x.active?'<span class="pill">AKTIF</span>':'NONAKTIF',x.createdAt?new Date(x.createdAt).toLocaleString('id-ID'):'-'];for(let i=0;i<4;i++){const td=document.createElement('td');if(i===2)td.innerHTML=vals[i];else td.textContent=vals[i];tr.appendChild(td)}const td=document.createElement('td');const b=document.createElement('button');b.textContent='Del Token';b.className='danger';b.addEventListener('click',async()=>{if(!confirm(`Hapus lisensi ${x.label||x.id}? Bot terkait akan berhenti saat pengecekan lisensi berikutnya (maksimal sekitar 1 jam).`))return;b.disabled=true;try{await api('/api/licenses/'+encodeURIComponent(x.id),{method:'DELETE'});msg('listMsg','Lisensi dihapus.','success');await loadList($('query').value.trim()||null)}catch(e){msg('listMsg',e.message,'error');b.disabled=false}});td.appendChild(b);tr.appendChild(td);body.appendChild(tr)}}
$('addForm').addEventListener('submit',async e=>{e.preventDefault();msg('addMsg','Menambahkan lisensi...');try{const d=await api('/api/licenses',{method:'POST',body:JSON.stringify({token:$('token').value,label:$('label').value})});$('token').value='';$('label').value='';msg('addMsg','Lisensi berhasil ditambahkan. Token hanya ditampilkan tersamarkan.','success');await loadList()}catch(e){msg('addMsg',e.message,'error')}});
$('searchBtn').addEventListener('click',()=>loadList($('query').value.trim()));$('listBtn').addEventListener('click',()=>{$('query').value='';loadList()});$('query').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();loadList($('query').value.trim())}});$('logout').addEventListener('click',async()=>{try{await api('/api/auth/logout',{method:'POST',body:'{}'})}catch{}loggedIn=false;$('app').classList.add('hidden');$('loginCard').classList.remove('hidden');msg('loginMsg','Kamu sudah logout.','success')});
</script></body></html>
